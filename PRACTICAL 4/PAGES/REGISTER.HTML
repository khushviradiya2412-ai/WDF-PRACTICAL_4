<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/INTERACTIVE.CSS">
</head>
<body>

    <!-- ==================== REGISTER PAGE ====================
         Registration form on a centered white box.
         We collect personal info and academic info.
    =========================================================== -->

    <div class="auth-wrapper">
        <div class="auth-box" style="max-width: 550px;">

            <h2>Create Student Account</h2>
            <p>Join the Student Hub Portal</p>

            <!-- REGISTRATION FORM
                 action: goes to login page after submitting
                 method: GET (simple for demo/learning purposes) -->
            <form action="LOGIN.HTML" method="GET">

                <!-- PERSONAL INFORMATION section -->
                <h3 style="margin: 20px 0 12px; font-size: 16px; color: #2c3e50;">Personal Information</h3>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Khush Viradiya" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
                </div>

                <!-- ACADEMIC INFORMATION section -->
                <h3 style="margin: 20px 0 12px; font-size: 16px; color: #2c3e50;">Academic Information</h3>

                <div class="form-group">
                    <label for="studentid">Student ID / Roll No</label>
                    <input type="text" id="studentid" name="studentid" placeholder="e.g. 25DCE123" required>
                </div>

                <div class="form-group">
                    <label for="department">Department / Branch</label>
                    <input type="text" id="department" name="department" placeholder="Computer Engineering" required>
                </div>

                <div class="form-group">
                    <label for="semester">Current Semester</label>
                    <input type="text" id="semester" name="semester" placeholder="3rd Semester" required>
                </div>

                <div class="form-group">
                    <label for="enrollment">Enrollment Year</label>
                    <input type="number" id="enrollment" name="enrollment" placeholder="2025" min="2000" max="2099" required>
                </div>

                <!-- AGREEMENT checkboxes -->
                <h3 style="margin: 20px 0 12px; font-size: 16px; color: #2c3e50;">Agreement</h3>

                <div style="margin-bottom: 10px; font-size: 14px;">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" style="color: #3498db;">Terms of Service</a> and
                        <a href="#" style="color: #3498db;">Privacy Policy</a>
                    </label>
                </div>

                <div style="margin-bottom: 10px; font-size: 14px;">
                    <input type="checkbox" id="notifications">
                    <label for="notifications">Send me updates about courses and events</label>
                </div>

                <div style="margin-bottom: 16px; font-size: 14px;">
                    <input type="checkbox" id="conduct" required>
                    <label for="conduct">
                        I agree to the <a href="#" style="color: #3498db;">Code of Conduct</a>
                    </label>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary" style="width: 100%;">&#10003; Create Account</button>

            </form>

            <!-- Footer links -->
            <div class="auth-footer">
                <p>Already have an account? <a href="LOGIN.HTML">Sign in here</a></p>
                <p><a href="../INDEX.HTML">&larr; Back to Home</a></p>
            </div>

        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 Student Hub Portal. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../JS/SCRIPT.JS"></script>
</body>
</html>
